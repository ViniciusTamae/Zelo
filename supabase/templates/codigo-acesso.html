<!-- E-mail com o código de acesso do proprietário (login sem senha).
     Só HTML com estilos inline e tabelas: é o que os leitores de e-mail aceitam.
     O botão abre /entrar já com o código preenchido; o login só acontece quando
     a pessoa toca em "Entrar" (a prévia automática do leitor não gasta o código). -->
<!doctype html>
<html lang="pt-BR">
  <body style="margin: 0; padding: 0; background-color: #FAFAF9;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #FAFAF9; padding: 24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 440px; background-color: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 12px; overflow: hidden; font-family: Inter, Arial, Helvetica, sans-serif; color: #1C1917;">
            <tr>
              <td style="background-color: #0F766E; padding: 20px 24px;">
                <!-- PNG, porque muitos leitores de e-mail não exibem SVG -->
                <img src="{{ .SiteURL }}/brand/zelo-logo-branco.png" alt="Zelo" height="32" style="display: block; height: 32px; border: 0; color: #FFFFFF; font-size: 24px; font-weight: 600;" />
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 24px 8px;">
                <p style="margin: 0 0 8px; font-size: 16px;">Seu código para entrar no Zelo:</p>
                <p style="margin: 16px 0; font-size: 36px; font-weight: 600; letter-spacing: 8px; color: #1C1917;">{{ .Token }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 24px 24px;">
                <a href="{{ .SiteURL }}/entrar?email={{ .Email }}&codigo={{ .Token }}" style="display: inline-block; background-color: #0F766E; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 24px; border-radius: 8px;">Abrir o Zelo com o código</a>
                <p style="margin: 16px 0 0; font-size: 14px; color: #78716C;">O código vale por 10 minutos. Se você não pediu para entrar, pode ignorar este e-mail.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
